name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package-version.outputs.name }}
      package_version: ${{ steps.package-version.outputs.version }}
      version_exists: ${{ steps.check-version.outputs.exists }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check npm tarball contents
        run: node scripts/check-pack-contents.mjs

      - name: Get package name and version
        id: package-version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT

      - name: Verify release tag
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_tag="v${PACKAGE_VERSION}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION (expected $expected_tag)"
            exit 1
          fi

      - name: Check if version exists on NPM
        id: check-version
        env:
          PACKAGE_NAME: ${{ steps.package-version.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set +e
          npm_output=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>&1)
          npm_status=$?
          set -e

          if [ "$npm_status" -eq 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION already exists on NPM"
          elif printf '%s\n' "$npm_output" | grep -q 'E404'; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION does not exist on NPM"
          else
            printf '%s\n' "$npm_output"
            echo "::error::Unable to determine whether version $PACKAGE_VERSION exists on NPM"
            exit "$npm_status"
          fi

      - name: Publish to NPM
        if: steps.check-version.outputs.exists == 'false'
        run: npm publish --access public

      - name: Skip publishing (version exists)
        if: steps.check-version.outputs.exists == 'true'
        run: |
          echo "Skipping NPM publish - version ${{ steps.package-version.outputs.version }} already exists"

  notify:
    name: Publish Notification
    needs: publish
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Success notification
        env:
          PACKAGE_NAME: ${{ needs.publish.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package_version }}
          VERSION_EXISTS: ${{ needs.publish.outputs.version_exists }}
        run: |
          if [ "$VERSION_EXISTS" = "true" ]; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION already exists on NPM; publish was skipped"
          else
            echo "$PACKAGE_NAME@$PACKAGE_VERSION was successfully published to NPM"
          fi
          echo "View at: https://www.npmjs.com/package/$PACKAGE_NAME/v/$PACKAGE_VERSION"
